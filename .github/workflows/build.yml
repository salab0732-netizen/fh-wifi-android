name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle.log; EXIT=${PIPESTATUS[0]}
          echo "=== LAST 100 LINES ==="
          tail -100 /tmp/gradle.log
          echo "=== EXIT CODE: $EXIT ==="
          exit $EXIT

      - name: Find APK
        if: always()
        run: find . -name "*.apk" 2>/dev/null && echo "---" && find app/build -type f -name "*.apk" 2>/dev/null || echo "No APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FHWifi-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
